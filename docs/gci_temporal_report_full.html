function destroyAll(){Object.keys(CH).forEach(k=>{try{CH[k].destroy();}catch(e){}});CH={};}

function load(key){

function render(){
  const b=DATA[current];
  const months12=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"].slice(0,b.income.length);
  const scoreColor=s=>s>=70?"var(--color-text-success)":s>=50?"var(--color-text-warning)":"var(--color-text-danger)";
  const barColor=s=>s>=70?"var(--color-text-success)":s>=50?"var(--color-text-warning)":"var(--color-text-danger)";
  const festHtml=b.festivals.map(f=>`<span class="ftag ${f.active?"active":"risk"}">${f.name} ${f.pct}</span>`).join("");

    <div class="shap-lbl">${s.lbl}</div>
    <div class="shap-track"><div class="shap-fill" style="width:${s.val}%;background:${s.pos?"var(--color-text-info)":"var(--color-text-danger)"}"></div></div>
    <div class="shap-val" style="color:${s.pos?"var(--color-text-info)":"var(--color-text-danger)"}">${s.pos?"+":"−"}${s.val}pts</div>
  </div>`).join("");
  const decompHtml=`
    <div class="decomp-row"><div class="d-dot" style="background:var(--color-text-success)"></div><div class="d-main"><div class="d-title">Festival &amp; seasonal component</div><div class="d-sub">Diwali, IPL, Navratri, monsoon, harvest cycles</div></div><div class="d-pct" style="color:var(--color-text-success)">${b.festivalPct}%</div><span class="d-tag tag-g">Explained</span></div>
    <div class="decomp-row"><div class="d-dot" style="background:var(--color-text-info)"></div><div class="d-main"><div class="d-title">Weekly demand rhythm</div><div class="d-sub">Fri–Sun consistently above weekday average</div></div><div class="d-pct" style="color:var(--color-text-info)">${b.weeklyPct}%</div><span class="d-tag tag-b">Explained</span></div>
    <div class="decomp-row"><div class="d-dot" style="background:var(--color-text-danger)"></div><div class="d-main"><div class="d-title">True stochastic residual</div><div class="d-sub">Unexplained variation — the only penalised component</div></div><div class="d-pct" style="color:var(--color-text-danger)">${b.residualPct}%</div><span class="d-tag tag-r">Risk signal</span></div>`;
  const stressHtml=b.stress.map((v,i)=>{
    const c=v>=70?"var(--color-text-success)":v>=50?"var(--color-text-warning)":"var(--color-text-danger)";
    return `<div class="stress-card">
      <div class="st-scenario">${b.stressLabels[i]}</div>
      <div class="st-val" style="color:${c}">${v}%</div>
      <div class="st-sub">repayment probability</div>
    </div>`;
  }).join("");
  const tlColors=b.income.map((_,i)=>{
    const v=b.income[i];
    const avg=b.income.reduce((a,c)=>a+c,0)/b.income.length;
    if(current==="vikram"&&i>=5) return "#b91c1c";
    if(v>avg*1.2) return "#0f766e";
    if(v<avg*0.85) return "#4a5568";
    return "#185fa5";
  });
  const tlHtml=`<div class="timeline-row">${b.income.map((v,i)=>`<div class="tl-cell" style="background:${tlColors[i]}"><div class="tl-month">${months12[i]}</div><div class="tl-val">${v}k</div></div>`).join("")}</div>`;

  <div class="report-header">
    <div class="rh-top">
      <div style="flex:1">
        <div class="rh-title">GCI Temporal Analysis Report</div>
        <div style="font-size:18px;font-weight:500;margin-bottom:4px">${b.name}</div>
        <div style="font-size:12px;color:var(--color-text-secondary)">${b.occ} &nbsp;·&nbsp; ${b.city} &nbsp;·&nbsp; ${b.tier}</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px">
          <span style="font-size:11px;padding:2px 8px;border-radius:8px;background:var(--color-background-secondary);color:var(--color-text-secondary);border:0.5px solid var(--color-border-tertiary)">Report ${b.reportId}</span>
          <span style="font-size:11px;padding:2px 8px;border-radius:8px;background:var(--color-background-secondary);color:var(--color-text-secondary);border:0.5px solid var(--color-border-tertiary)">Generated ${b.date}</span>
          <span style="font-size:11px;padding:2px 8px;border-radius:8px;background:var(--color-background-secondary);color:var(--color-text-secondary);border:0.5px solid var(--color-border-tertiary)">Valid 30 days</span>
        </div>
      </div>
      <div class="score-badge ${b.gciColor}">
        <div class="sb-num ${b.gciColor}">${b.gci}</div>
        <div class="sb-lbl ${b.gciColor}">${b.gciBand}</div>
      </div>
    </div>
    <div class="meta-grid">
      <div class="meta-item"><div class="mi-label">Avg Net Monthly Income</div><div class="mi-val">${b.anmi}</div></div>
      <div class="meta-item"><div class="mi-label">Active tenure</div><div class="mi-val">${b.tenure}</div></div>
      <div class="meta-item"><div class="mi-label">Transactions analysed</div><div class="mi-val">${b.txns.toLocaleString()}</div></div>
      <div class="meta-item"><div class="mi-label">Probability of default</div><div class="mi-val" style="color:${b.pd>30?"var(--color-text-danger)":b.pd>15?"var(--color-text-warning)":"var(--color-text-success)"}">${b.pd.toFixed(1)}%</div></div>
      <div class="meta-item"><div class="mi-label">Manipulation risk</div><div class="mi-val" style="color:${b.manipulation==="Clean"?"var(--color-text-success)":b.manipulation==="Suspicious"?"var(--color-text-warning)":"var(--color-text-danger)"}">${b.manipulation}</div></div>
      <div class="meta-item"><div class="mi-label">Cohort percentile</div><div class="mi-val">${b.cohortPct}th pct</div></div>
    </div>
  </div>

  <div class="section">
    <div class="sec-hdr"><div class="sec-title">Section 1 — Core Creditworthiness Scores</div></div>
    <div class="g4">
      <div class="score-card"><div class="sc-lbl">Income Stability Index</div><div class="sc-val" style="color:${scoreColor(b.stability)}">${b.stability}</div><div class="sc-bar"><div class="sc-fill" style="width:${b.stability}%;background:${barColor(b.stability)}"></div></div></div>
      <div class="score-card"><div class="sc-lbl">Liquidity Cover Ratio</div><div class="sc-val" style="color:${scoreColor(b.liquidity)}">${b.liquidity}</div><div class="sc-bar"><div class="sc-fill" style="width:${b.liquidity}%;background:${barColor(b.liquidity)}"></div></div></div>
      <div class="score-card"><div class="sc-lbl">Expense Discipline</div><div class="sc-val" style="color:${scoreColor(b.discipline)}">${b.discipline}</div><div class="sc-bar"><div class="sc-fill" style="width:${b.discipline}%;background:${barColor(b.discipline)}"></div></div></div>
      <div class="score-card"><div class="sc-lbl">Repayment Capacity</div><div class="sc-val" style="color:${scoreColor(b.repayment)}">${b.repayment}</div><div class="sc-bar"><div class="sc-fill" style="width:${b.repayment}%;background:${barColor(b.repayment)}"></div></div></div>
    </div>
    <div style="margin-top:12px">
      <div style="font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.05em;color:var(--color-text-secondary);margin-bottom:6px">Cohort percentile rank — ${b.occ} · ${b.tier}</div>
      <div class="cohort-bar-wrap">
        <div class="cohort-track">
          <div class="cohort-fill" style="width:${b.cohortPct}%"></div>
          <div class="cohort-marker" style="left:${b.cohortPct}%"></div>
        </div>
        <div class="cohort-labels"><span>0th pct</span><span>25th</span><span>50th</span><span>75th</span><span>100th</span></div>
      </div>
      <div style="font-size:12px;color:var(--color-text-secondary);margin-top:4px">This borrower ranks at the <strong style="color:var(--color-text-primary)">${b.cohortPct}th percentile</strong> within their occupation-city-tenure cohort. Income trend: <strong style="color:var(--color-text-primary)">${b.trendSlope}</strong> (${b.trendDir}).</div>
    </div>
  </div>

  <div class="section">
    <div class="sec-hdr">
      <div class="sec-title">Section 2 — Temporal Income Analysis (12-Month)</div>
      <span class="sec-badge" style="background:var(--color-background-info);color:var(--color-text-info)">CVD Framework</span>
    </div>
    <div style="margin-bottom:10px">${tlHtml}</div>
    <div class="g2">
      <div>
        <div style="font-size:11px;font-weight:500;color:var(--color-text-secondary);margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em">Income decomposition — raw / seasonal / residual</div>
        <div style="position:relative;width:100%;height:200px"><canvas id="ch-decomp" role="img" aria-label="Income decomposition line chart showing raw, seasonal, and residual components">Decomposition data for ${b.name}</canvas></div>
        <div class="legend">
          <span class="leg"><span class="leg-sq" style="background:#185fa5"></span>Raw income (Rs k)</span>
          <span class="leg"><span class="leg-sq" style="background:#1d9e75"></span>Seasonal component</span>
          <span class="leg"><span class="leg-sq" style="background:#e24b4a"></span>Residual (risk signal)</span>
          <span class="leg"><span class="leg-sq" style="background:#888;opacity:.4"></span>Trend</span>
        </div>
      </div>
      <div>
        <div style="font-size:11px;font-weight:500;color:var(--color-text-secondary);margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em">Variance attribution — CVD breakdown</div>
        <div style="position:relative;width:100%;height:200px"><canvas id="ch-pie" role="img" aria-label="Donut chart: Festival ${b.festivalPct}%, Weekly ${b.weeklyPct}%, Residual ${b.residualPct}%">Festival ${b.festivalPct}%, Weekly ${b.weeklyPct}%, Residual ${b.residualPct}%</canvas></div>
        <div class="legend">
          <span class="leg"><span class="leg-sq" style="background:#1d9e75"></span>Festival/seasonal ${b.festivalPct}%</span>
          <span class="leg"><span class="leg-sq" style="background:#185fa5"></span>Weekly cycles ${b.weeklyPct}%</span>
          <span class="leg"><span class="leg-sq" style="background:#e24b4a"></span>Residual risk ${b.residualPct}%</span>
        </div>
      </div>
    </div>
    <div style="margin-top:12px">${decompHtml}</div>
    <div style="margin-top:10px;background:var(--color-background-${b.explainedPct>=70?"info":b.explainedPct>=50?"warning":"danger"});border:0.5px solid var(--color-border-${b.explainedPct>=70?"info":b.explainedPct>=50?"warning":"danger"});border-radius:var(--border-radius-md);padding:10px 12px;font-size:12px;color:var(--color-text-${b.explainedPct>=70?"info":b.explainedPct>=50?"warning":"danger"})">
      <strong>CVD Finding:</strong> ${b.cvdNote}
    </div>
    <div style="margin-top:10px">
      <div style="font-size:11px;font-weight:500;color:var(--color-text-secondary);margin-bottom:4px;text-transform:uppercase;letter-spacing:.04em">Calendar event map</div>
      <div class="festival-row">${festHtml}</div>
    </div>
  </div>

  <div class="section">
    <div class="sec-hdr">
      <div class="sec-title">Section 3 — Income Trend &amp; Liquidity Buffer</div>
    </div>
    <div class="g2">
      <div>
        <div style="font-size:11px;font-weight:500;color:var(--color-text-secondary);margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em">12-month income with trend line</div>
        <div style="position:relative;width:100%;height:190px"><canvas id="ch-trend" role="img" aria-label="Income trend chart with moving average">Income trend for ${b.name}</canvas></div>
      </div>
      <div>
        <div style="font-size:11px;font-weight:500;color:var(--color-text-secondary);margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em">End-of-month balance — liquidity cover</div>
        <div style="position:relative;width:100%;height:190px"><canvas id="ch-liq" role="img" aria-label="Liquidity buffer chart with RBI threshold line">Liquidity data for ${b.name}</canvas></div>
        <div class="legend" style="margin-top:6px">
          <span class="leg"><span class="leg-sq" style="background:#185fa5"></span>Balance (Rs k)</span>
          <span class="leg" style="display:flex;align-items:center;gap:4px"><span style="width:16px;height:2px;background:#e24b4a;display:inline-block;border-top:2px dashed #e24b4a"></span>RBI 2-week buffer floor</span>
        </div>
      </div>
    </div>
  </div>

  <div class="section">
    <div class="sec-hdr">
      <div class="sec-title">Section 4 — Stress Simulation (Monte Carlo · 500 runs)</div>
    </div>
    <div class="g3" style="margin-bottom:12px">${stressHtml}</div>
    <div style="position:relative;width:100%;height:190px"><canvas id="ch-stress" role="img" aria-label="Stress test grouped bar chart: ${b.stress.join('%, ')}%">Stress: ${b.stress.join(', ')}</canvas></div>
    <div style="margin-top:10px;font-size:12px;color:var(--color-text-secondary)">Monte Carlo simulation across 500 income trajectory scenarios per stress level. EMI assumed: Rs ${Math.round(b.gci*1.8+200).toLocaleString()}/month. Scenarios modelled: (1) Normal seasonal pattern, (2) 25% sustained income reduction, (3) 40% sustained income reduction.</div>
  </div>

  <div class="section">
    <div class="sec-hdr">
      <div class="sec-title">Section 5 — Feature Importance (SHAP Explainability)</div>
      <span class="sec-badge" style="background:var(--color-background-success);color:var(--color-text-success)">RBI Compliant</span>
    </div>
    <div style="font-size:12px;color:var(--color-text-secondary);margin-bottom:10px">SHAP (SHapley Additive Explanations) values showing contribution of each feature to final GCI score. Positive values increase score; negative values reduce it. Required under RBI Digital Lending Guidelines 2022, Section 7.3.</div>
    ${shapHtml}
  </div>

  <div class="${b.recType==="approve"?"rec-section approve":b.recType==="reject"?"rec-section reject":"rec-section conditional"}">
    <div class="rec-hdr">${b.recTitle}</div>
    <table class="rec-table"><tbody>
      ${b.recRows.map(([k,v])=>`<tr><td class="rec-key">${k}</td><td class="rec-val">${v}</td></tr>`).join("")}
    </tbody></table>
  </div>

  <div class="disclaimer">
    Supplementary risk assessment — not a regulated credit score. Report ${b.reportId} · GCI System v1.0<br>
    Final lending decision rests with the lender. Processed under borrower consent per Account Aggregator framework.<br>
    RBI Digital Lending Guidelines (2022) compliant. Data encrypted at rest. Report valid 30 days from generation.
  </div>`;
}

function drawCharts(){
  const b=DATA[current];
  const months=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"].slice(0,b.income.length);
  const baseOpts={responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{grid:{display:false},ticks:{font:{size:10}}},y:{grid:{color:"rgba(0,0,0,0.06)"},ticks:{font:{size:10}}}}};

  const d1=document.getElementById("ch-decomp");
  if(d1){CH["d1"]=new Chart(d1,{type:"line",data:{labels:months,datasets:[
    {data:b.income,borderColor:"#185fa5",backgroundColor:"rgba(24,95,165,0.07)",borderWidth:2,pointRadius:3,fill:true,tension:0.3,label:"Raw"},
    {data:b.trend,borderColor:"rgba(136,135,128,0.5)",borderDash:[4,4],borderWidth:1,pointRadius:0,fill:false,tension:0.4,label:"Trend"},
    {data:b.seasonal,borderColor:"#1d9e75",borderWidth:1.5,pointRadius:0,fill:false,tension:0.4,label:"Seasonal"},
    {data:b.residual,borderColor:"#e24b4a",borderWidth:1.5,pointRadius:3,pointBackgroundColor:"#e24b4a",fill:false,tension:0.2,label:"Residual"},
  ]},options:{...baseOpts,scales:{x:{grid:{display:false},ticks:{font:{size:10}}},y:{grid:{color:"rgba(0,0,0,0.06)"},ticks:{font:{size:10},callback:v=>`${v}k`}}}}})}

  const d2=document.getElementById("ch-pie");
  if(d2){CH["d2"]=new Chart(d2,{type:"doughnut",data:{labels:["Festival/seasonal","Weekly cycles","Residual risk"],datasets:[{data:[b.festivalPct,b.weeklyPct,b.residualPct],backgroundColor:["#1d9e75","#185fa5","#e24b4a"],borderWidth:3,borderColor:"var(--color-background-primary)"}]},options:{responsive:true,maintainAspectRatio:false,cutout:"62%",plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>`${ctx.label}: ${ctx.raw}%`}}}}})}

  const d3=document.getElementById("ch-trend");
  if(d3){
    const avg=b.income.reduce((a,c)=>a+c,0)/b.income.length;
    CH["d3"]=new Chart(d3,{type:"line",data:{labels:months,datasets:[
      {data:b.income,borderColor:"#185fa5",backgroundColor:"rgba(24,95,165,0.08)",borderWidth:2,pointRadius:3,fill:true,tension:0.3},
      {data:b.income.map(()=>avg),borderColor:"rgba(136,135,128,0.6)",borderDash:[6,3],borderWidth:1,pointRadius:0,fill:false,label:"12m avg"},
    ]},options:{...baseOpts,scales:{x:{grid:{display:false},ticks:{font:{size:10}}},y:{grid:{color:"rgba(0,0,0,0.06)"},ticks:{font:{size:10},callback:v=>`${v}k`}}}}})}

  const d4=document.getElementById("ch-liq");
  if(d4){
    const weeklyExpense=b.income.map(v=>v*0.65/4.3);
    const balance=b.income.map((v,i)=>+(v*0.18+Math.sin(i)*0.5+2).toFixed(1));
    const floor=weeklyExpense.map(w=>+(w*2).toFixed(1));
    CH["d4"]=new Chart(d4,{type:"line",data:{labels:months,datasets:[
      {data:balance,borderColor:"#185fa5",backgroundColor:"rgba(24,95,165,0.08)",borderWidth:2,pointRadius:3,fill:true,tension:0.3},
      {data:floor,borderColor:"#e24b4a",borderDash:[5,3],borderWidth:1.5,pointRadius:0,fill:false},
    ]},options:{...baseOpts,scales:{x:{grid:{display:false},ticks:{font:{size:10}}},y:{grid:{color:"rgba(0,0,0,0.06)"},ticks:{font:{size:10},callback:v=>`${v}k`}}}}})}

  const d5=document.getElementById("ch-stress");
  if(d5){
    const clrs=b.stress.map(v=>v>=70?"#15803d":v>=50?"#b45309":"#b91c1c");
    CH["d5"]=new Chart(d5,{type:"bar",data:{labels:b.stressLabels,datasets:[{data:b.stress,backgroundColor:clrs,borderWidth:0,borderRadius:5}]},options:{...baseOpts,scales:{x:{grid:{display:false},ticks:{font:{size:11}}},y:{max:100,grid:{color:"rgba(0,0,0,0.06)"},ticks:{font:{size:10},callback:v=>`${v}%`}}},plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>`${ctx.raw}% repayment probability`}}}}})}
}

render();
setTimeout(drawCharts,100);
</script>
