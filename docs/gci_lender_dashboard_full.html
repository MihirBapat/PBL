<style>

.content{padding:16px 20px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:12px}

.card-title{font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.05em;color:var(--color-text-secondary);margin-bottom:10px}
.metric-val{font-size:24px;font-weight:500}
.metric-sub{font-size:11px;color:var(--color-text-secondary);margin-top:3px}
.badge{display:inline-block;font-size:10px;font-weight:500;padding:2px 8px;border-radius:10px;letter-spacing:.03em}

.risk-box{background:var(--color-background-danger);border:0.5px solid var(--color-border-danger);border-radius:var(--border-radius-lg);padding:14px}

let currentBorrower = "raju";
let charts = {};

function switchBorrower(val) {
  currentBorrower = val;
  document.getElementById('report-id').textContent = "Report " + BORROWERS[val].reportId + " · Valid 30 days";
  renderAll();
}

function showTab(n) {
  document.getElementById('tab1').className = n===1?"tab active":"tab";
  document.getElementById('tab2').className = n===2?"tab active":"tab";
  document.getElementById('content1').style.display = n===1?"":"none";
  document.getElementById('content2').style.display = n===2?"":"none";
  if(n===2) setTimeout(renderTab2Charts,50);
  if(n===1) setTimeout(renderTab1Charts,50);
}

function destroyChart(id) {
  if(charts[id]) { try{charts[id].destroy();}catch(e){} delete charts[id]; }
}

function renderAll() {
  renderTab1();
  const t2vis = document.getElementById('content2').style.display !== 'none';
  if(t2vis) { renderTab2(); setTimeout(renderTab2Charts,50); }
  setTimeout(renderTab1Charts,50);
}

function renderTab1() {
  const b = BORROWERS[currentBorrower];
  const isFail = b.manipulation==="High Risk";
  const isWarn = b.manipulation==="Suspicious";
  const bannerHtml = isFail
    ? `<div class="warn-banner">HIGH RISK — 4 manipulation flags triggered. Isolation Forest anomaly score: ${b.anomaly.toFixed(2)}. Penalty multiplier: ${b.penalty}. Application flagged for compliance review.</div>`
    : isWarn
    ? `<div style="background:var(--color-background-warning);border:0.5px solid var(--color-border-warning);border-radius:var(--border-radius-md);padding:10px 12px;font-size:12px;color:var(--color-text-warning);margin-bottom:12px">SUSPICIOUS — 1 soft flag triggered. Isolation Forest anomaly score: ${b.anomaly.toFixed(2)}. Penalty multiplier: ${b.penalty}. Proceed with reduced loan amount.</div>`
    : `<div class="info-banner">CLEAN — All manipulation checks passed. Isolation Forest anomaly score: ${b.anomaly.toFixed(2)}. No penalty applied (1.0x multiplier).</div>`;

  const flagsHtml = b.flags.map(f=>`
    <div class="flag-row">
      <div class="flag-indicator" style="background:${f.ok?"var(--color-text-success)":"var(--color-text-danger)"}"></div>
      <div style="flex:1">
        <div class="flag-label" style="color:${f.ok?"var(--color-text-primary)":"var(--color-text-danger)"}">${f.name}</div>
        <div class="flag-reason">${f.reason}</div>
      </div>
      <span class="badge ${f.ok?"badge-green":"badge-red"}">${f.ok?"Clean":"Flagged"}</span>
    </div>`).join("");

  document.getElementById('content1').innerHTML = `
    ${bannerHtml}
    <div class="grid4">
      <div class="card">
        <div class="card-title">GCI Score</div>
        <div class="metric-val ${b.gciColor}">${b.gci}</div>
        <div class="metric-sub">${b.gciBand} · 300–900 scale</div>
        <div class="score-bar" style="margin-top:8px"><div class="score-fill" style="width:${Math.round((b.gci-300)/6)}%;background:${b.gciColor==='green'?'var(--color-text-success)':b.gciColor==='red'?'var(--color-text-danger)':'var(--color-text-warning)'}"></div></div>

      <div class="card">
        <div class="card-title">Manipulation risk</div>

      <div class="card">
        <div class="card-title">Probability of default</div>
        <div class="metric-val ${b.pd>30?"red":b.pd>15?"amber":"green"}">${b.pd.toFixed(1)}%</div>
        <div class="metric-sub">XGBoost model output</div>

      </div>
    </div>
    <div class="grid2">
      <div class="card">
        <div class="section-row">
          <div class="card-title" style="margin-bottom:0">Fraud detection checklist</div>
          <span class="meta-pill">${b.occ}</span>
        </div>
        <div style="margin-top:10px">${flagsHtml}</div>
      </div>
      <div class="card">
        <div class="card-title">Anomaly score gauge</div>
        <div style="position:relative;width:100%;height:180px"><canvas id="gaugeChart" role="img" aria-label="Anomaly score gauge showing ${b.anomaly.toFixed(2)} out of 1.0">${b.anomaly.toFixed(2)} anomaly score</canvas></div>
        <div class="legend">
          <span class="leg-item"><span class="leg-box" style="background:#15803d"></span>0.0–0.65 Clean</span>
          <span class="leg-item"><span class="leg-box" style="background:#b45309"></span>0.65–0.80 Suspicious</span>
          <span class="leg-item"><span class="leg-box" style="background:#b91c1c"></span>0.80–1.0 High Risk</span>
        </div>
      </div>
    </div>
    <div class="grid2">
      <div class="card">
        <div class="card-title">Monthly income — anomaly overlay</div>
        <div style="position:relative;width:100%;height:180px"><canvas id="incomeAnomalyChart" role="img" aria-label="Monthly income bar chart with anomaly overlay">Monthly income data for ${b.name}</canvas></div>
        <div class="legend" style="margin-top:8px">
          <span class="leg-item"><span class="leg-box" style="background:#1d9e75"></span>Normal months</span>
          <span class="leg-item"><span class="leg-box" style="background:#e24b4a"></span>Flagged months</span>
          <span class="leg-item"><span class="leg-box" style="background:#ef9f27"></span>Festival window</span>
        </div>
      </div>
      <div class="card">
        <div class="card-title">Expense signature timeline</div>
        <div style="position:relative;width:100%;height:180px"><canvas id="expenseChart" role="img" aria-label="Expense categories over time">Expense data for ${b.name}</canvas></div>
        <div class="legend" style="margin-top:8px">
          <span class="leg-item"><span class="leg-box" style="background:#185fa5"></span>Recurring expenses</span>
          <span class="leg-item"><span class="leg-box" style="background:#b4b2a9"></span>Variable expenses</span>
        </div>
      </div>
    </div>`;
}

function renderTab1Charts() {
  const b = BORROWERS[currentBorrower];
  destroyChart('gaugeChart'); destroyChart('incomeAnomalyChart'); destroyChart('expenseChart');
  const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"].slice(0,b.incomeData.length);
  const isFlagged = b.manipulation!=="Clean";

  const gaugeEl = document.getElementById('gaugeChart');
  if(gaugeEl) {
    const score = b.anomaly;
    const clr = score>0.80?"#b91c1c":score>0.65?"#b45309":"#15803d";
    charts['gaugeChart'] = new Chart(gaugeEl, {
      type:"doughnut",
      data:{datasets:[
        {data:[score,1-score],backgroundColor:[clr,"rgba(0,0,0,0.06)"],borderWidth:0,circumference:180,rotation:270},
        {data:[0.65,0.15,0.20],backgroundColor:["rgba(21,128,61,0.15)","rgba(180,83,9,0.15)","rgba(185,28,28,0.15)"],borderWidth:0,circumference:180,rotation:270}
      ]},
      options:{responsive:true,maintainAspectRatio:false,cutout:"70%",plugins:{legend:{display:false},tooltip:{enabled:false}},layout:{padding:10}}
    });
    setTimeout(()=>{
      const ctx=gaugeEl.getContext('2d');
      const cx=gaugeEl.width/2, cy=gaugeEl.height*0.82;
      ctx.font="bold 22px sans-serif"; ctx.fillStyle=clr; ctx.textAlign="center";
      ctx.fillText(score.toFixed(2),cx,cy);
      ctx.font="12px sans-serif"; ctx.fillStyle="#888";
      ctx.fillText("anomaly score",cx,cy+18);
    },100);
  }

  const incEl = document.getElementById('incomeAnomalyChart');
  if(incEl) {
    const flagMonths = isFlagged ? b.incomeData.map((_,i)=>i>=Math.floor(b.incomeData.length*0.6)?true:false) : b.incomeData.map(()=>false);
    const festMonths = [3,8,9];
    charts['incomeAnomalyChart'] = new Chart(incEl, {
      type:"bar",
      data:{labels:months,datasets:[{
        data:b.incomeData,
        backgroundColor:b.incomeData.map((_,i)=>flagMonths[i]?"#e24b4a":festMonths.includes(i)&&!isFlagged?"#ef9f27":"#1d9e75"),
        borderWidth:0, borderRadius:3
      }]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>`Rs ${ctx.raw}k`}}},scales:{x:{grid:{display:false},ticks:{font:{size:10}}},y:{grid:{color:"rgba(0,0,0,0.06)"},ticks:{font:{size:10},callback:v=>`${v}k`}}}}
    });
  }

  const expEl = document.getElementById('expenseChart');
  if(expEl) {
    const recurr = b.incomeData.map((v,i)=>{
      const base = Math.round(v*0.35);
      if(b.manipulation!=="Clean"&&i>=Math.floor(b.incomeData.length*0.7)) return 0;
      return base;
    });
    const variable = b.incomeData.map((v,i)=>Math.round(v*0.28+(Math.random()*1)));
    charts['expenseChart'] = new Chart(expEl, {
      type:"bar",
      data:{labels:months,datasets:[
        {label:"Recurring",data:recurr,backgroundColor:"#185fa5",borderWidth:0,borderRadius:2,stack:"s"},
        {label:"Variable",data:variable,backgroundColor:"rgba(136,135,128,0.5)",borderWidth:0,borderRadius:2,stack:"s"},
      ]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{stacked:true,grid:{display:false},ticks:{font:{size:10}}},y:{stacked:true,grid:{color:"rgba(0,0,0,0.06)"},ticks:{font:{size:10},callback:v=>`${v}k`}}}}
    });
  }
}

      ].map(([k,v])=>`<div class="rec-row" style="border-color:var(--color-border-warning)"><div class="rec-key" style="color:var(--color-text-warning);opacity:.8">${k}</div><div class="rec-val" style="color:var(--color-text-warning)">${v}</div></div>`).join("")}</div>`
    : `<div class="rec-box"><div class="rec-title">Recommendation — Approve</div>${[
        ["Loan amount",b.loanAmt],["Monthly EMI",b.emi],["Tenure",b.tenure_loan],["Interest rate",b.rate],["Seasonal note",b.note]
      ].map(([k,v])=>`<div class="rec-row"><div class="rec-key">${k}</div><div class="rec-val">${v}</div></div>`).join("")}</div>`;

  document.getElementById('content2').innerHTML = `

      <div class="card">

        <div class="score-hero">
          <div>

          </div>
          <div style="flex:1">
            <div class="score-bar"><div class="score-fill" style="width:${Math.round((b.gci-300)/6)}%;background:${b.gciColor==='green'?'var(--color-text-success)':b.gciColor==='red'?'var(--color-text-danger)':'var(--color-text-warning)'}"></div></div>

      <div class="card"><div class="card-title">Probability of Default</div><div class="metric-val ${b.pd>30?"red":b.pd>15?"amber":"green"}">${b.pd.toFixed(1)}%</div><div class="metric-sub">XGBoost · AUC 0.84</div></div>
      <div class="card"><div class="card-title">Cohort percentile</div><div class="metric-val">${b.cohortPct}<span style="font-size:18px">th</span></div><div class="metric-sub">${b.occ} · ${b.city}</div></div>
    </div>
    <div class="grid4" style="margin-bottom:12px">
      <div class="card"><div class="card-title">Income Stability Index</div><div class="metric-val ${b.stability>65?"green":b.stability>45?"amber":"red"}">${b.stability}</div><div class="score-bar" style="margin-top:6px"><div class="score-fill fill-${b.stability>65?"green":b.stability>45?"amber":"red"}" style="width:${b.stability}%;background:${b.stability>65?'var(--color-text-success)':b.stability>45?'var(--color-text-warning)':'var(--color-text-danger)'}"></div></div></div>

      <div class="card"><div class="card-title">Expense Discipline</div><div class="metric-val ${b.discipline>65?"green":b.discipline>45?"amber":"red"}">${b.discipline}</div><div class="score-bar" style="margin-top:6px"><div class="score-fill" style="width:${b.discipline}%;background:${b.discipline>65?'var(--color-text-success)':b.discipline>45?'var(--color-text-warning)':'var(--color-text-danger)'}"></div></div></div>
      <div class="card"><div class="card-title">Repayment Capacity</div><div class="metric-val ${b.repayment>65?"green":b.repayment>45?"amber":"red"}">${b.repayment}</div><div class="score-bar" style="margin-top:6px"><div class="score-fill" style="width:${b.repayment}%;background:${b.repayment>65?'var(--color-text-success)':b.repayment>45?'var(--color-text-warning)':'var(--color-text-danger)'}"></div></div></div>

        <div class="legend" style="margin-top:8px">
          <span class="leg-item"><span class="leg-box" style="background:#1d9e75"></span>Festival/seasonal ${b.festivalPct}%</span>
          <span class="leg-item"><span class="leg-box" style="background:#185fa5"></span>Weekly cycles ${b.weeklyPct}%</span>
          <span class="leg-item"><span class="leg-box" style="background:#e24b4a"></span>Residual risk ${b.residualPct}%</span>

    </div>
    <div class="grid2">
      <div class="card">
        <div class="card-title">Stress simulation — repayment probability</div>
        <div style="position:relative;width:100%;height:180px"><canvas id="stressChart" role="img" aria-label="Stress test results: Normal ${b.stress[0]}%, 25% drop ${b.stress[1]}%, 40% drop ${b.stress[2]}%">Stress: ${b.stress.join(", ")}</canvas></div>

function renderTab2Charts() {
  const b = BORROWERS[currentBorrower];
  destroyChart('decompChart'); destroyChart('pieChart'); destroyChart('stressChart');
  const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"].slice(0,b.incomeData.length);
  const decompEl = document.getElementById('decompChart');
  if(decompEl) {
    charts['decompChart'] = new Chart(decompEl,{
      type:"line",
      data:{labels:months,datasets:[
        {label:"Raw income",data:b.incomeData,borderColor:"#185fa5",backgroundColor:"rgba(24,95,165,0.08)",borderWidth:2,pointRadius:3,fill:true,tension:0.3},
        {label:"Seasonal",data:b.seasonalData,borderColor:"#1d9e75",borderDash:[5,3],borderWidth:1.5,pointRadius:0,fill:false,tension:0.4},
        {label:"Residual",data:b.residualData,borderColor:"#e24b4a",borderWidth:1.5,pointRadius:2,fill:false,tension:0.2},
      ]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{grid:{display:false},ticks:{font:{size:10}}},y:{grid:{color:"rgba(0,0,0,0.06)"},ticks:{font:{size:10},callback:v=>`${v}k`}}}}
    });
  }
  const pieEl = document.getElementById('pieChart');
  if(pieEl) {
    charts['pieChart'] = new Chart(pieEl,{
      type:"doughnut",
      data:{labels:["Festival/seasonal","Weekly cycles","Residual risk"],
        datasets:[{data:[b.festivalPct,b.weeklyPct,b.residualPct],backgroundColor:["#1d9e75","#185fa5","#e24b4a"],borderWidth:2,borderColor:"var(--color-background-primary)"}]},
      options:{responsive:true,maintainAspectRatio:false,cutout:"60%",plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>`${ctx.label}: ${ctx.raw}%`}}}}
    });
  }
  const stEl = document.getElementById('stressChart');
  if(stEl) {
    const clrs = b.stress.map(v=>v>70?"#15803d":v>50?"#b45309":"#b91c1c");
    charts['stressChart'] = new Chart(stEl,{
      type:"bar",
      data:{labels:["Normal conditions","25% income drop","40% income drop"],
        datasets:[{data:b.stress,backgroundColor:clrs,borderWidth:0,borderRadius:4}]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>`${ctx.raw}% repayment probability`}}},scales:{x:{grid:{display:false},ticks:{font:{size:10}}},y:{max:100,grid:{color:"rgba(0,0,0,0.06)"},ticks:{font:{size:10},callback:v=>`${v}%`}}}}
    });
  }
}

renderTab1();
setTimeout(renderTab1Charts,100);
</script>
